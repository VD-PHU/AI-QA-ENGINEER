<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopEasy — Create Account</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f4f6f8; display:flex; justify-content:center; padding-top:60px; }
  .card { background:#fff; padding:32px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.08); width:360px; }
  h1 { font-size:20px; margin-top:0; }
  label { display:block; font-size:13px; margin-top:14px; margin-bottom:4px; color:#333; }
  input { width:100%; padding:8px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; font-size:14px; }
  input.invalid { border-color:#d93025; }
  .error { color:#d93025; font-size:12px; min-height:16px; margin-top:2px; }
  button { margin-top:20px; width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:4px; font-size:14px; cursor:pointer; }
  button:disabled { background:#93b4f7; cursor:not-allowed; }
  #successMsg { color:#137333; font-size:13px; margin-top:14px; display:none; }
  #formError { color:#d93025; font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>Create your ShopEasy account</h1>
  <form id="registerForm" novalidate>
    <label for="email">Email address</label>
    <input id="email" name="email" type="text" data-testid="email-input" autocomplete="off">
    <div class="error" id="emailError" data-testid="email-error"></div>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" data-testid="password-input" autocomplete="off">
    <div class="error" id="passwordError" data-testid="password-error"></div>

    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" name="confirmPassword" type="password" data-testid="confirm-password-input" autocomplete="off">
    <div class="error" id="confirmPasswordError" data-testid="confirm-password-error"></div>

    <button type="submit" id="submitBtn" data-testid="submit-button">Create account</button>
    <div id="successMsg" data-testid="success-message">Account created! Please check your email to verify your account.</div>
    <div id="formError" data-testid="form-error"></div>
  </form>
</div>

<script>
// Simulated "already registered" user store (seeded)
const EXISTING_USERS = new Set(["existing@test.com"]);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
const form = document.getElementById("registerForm");
const submitBtn = document.getElementById("submitBtn");

function setError(inputEl, errorEl, message) {
  if (message) {
    inputEl.classList.add("invalid");
    errorEl.textContent = message;
  } else {
    inputEl.classList.remove("invalid");
    errorEl.textContent = "";
  }
}

function validateEmail(value) {
  if (!value) return "Email is required.";
  // Spec: must be a valid email address, e.g. name@domain.tld
  const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!re.test(value)) return "Please enter a valid email address.";
  if (value.length > 254) return "Email address is too long.";
  return "";
}

function validatePassword(value) {
  if (!value) return "Password is required.";
  // Spec: 8-64 characters, at least one uppercase, one lowercase, one digit, one special character
  // BUG: should be value.length < 8 (i.e. require >= 8), but implemented as <= 8 (requires >= 9)
  if (value.length <8) return "Password must be at least 8 characters long.";
  if (value.length > 64) return "Password must be at most 64 characters long.";
  if (!/[A-Z]/.test(value)) return "Password must contain at least one uppercase letter.";
  if (!/[a-z]/.test(value)) return "Password must contain at least one lowercase letter.";
  if (!/[0-9]/.test(value)) return "Password must contain at least one digit.";
  if (!/[^A-Za-z0-9]/.test(value)) return "Password must contain at least one special character.";
  return "";
}

function validateConfirm(password, confirm) {
  if (!confirm) return "Please confirm your password.";
  if (password !== confirm) return "Passwords do not match.";
  return "";
}

emailInput.addEventListener("blur", () => setError(emailInput, document.getElementById("emailError"), validateEmail(emailInput.value.trim())));
passwordInput.addEventListener("blur", () => setError(passwordInput, document.getElementById("passwordError"), validatePassword(passwordInput.value)));
confirmInput.addEventListener("blur", () => setError(confirmInput, document.getElementById("confirmPasswordError"), validateConfirm(passwordInput.value, confirmInput.value)));

form.addEventListener("submit", (e) => {
  e.preventDefault();
  document.getElementById("successMsg").style.display = "none";
  document.getElementById("formError").style.display = "none";

  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const confirm = confirmInput.value;

  const emailErr = validateEmail(email);
  const passwordErr = validatePassword(password);
  const confirmErr = validateConfirm(password, confirm);

  setError(emailInput, document.getElementById("emailError"), emailErr);
  setError(passwordInput, document.getElementById("passwordError"), passwordErr);
  setError(confirmInput, document.getElementById("confirmPasswordError"), confirmErr);

  if (emailErr || passwordErr || confirmErr) {
    return;
  }

  // BUG: duplicate-email check is missing entirely (spec requires rejecting already-registered emails)
  // if (EXISTING_USERS.has(email.toLowerCase())) {
  //   document.getElementById("formError").textContent = "An account with this email already exists.";
  //   document.getElementById("formError").style.display = "block";
  //   return;
  // }

  submitBtn.disabled = true;
  submitBtn.textContent = "Creating account...";
  setTimeout(() => {
    EXISTING_USERS.add(email.toLowerCase());
    document.getElementById("successMsg").style.display = "block";
    submitBtn.disabled = false;
    submitBtn.textContent = "Create account";
    form.reset();
  }, 300);
});
</script>
</body>
</html>
